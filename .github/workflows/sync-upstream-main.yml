name: Sync upstream main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'tzraeq/opencodex'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # GITHUB_TOKEN cannot push commits that modify workflow files. This fork API
      # performs the fast-forward server-side with the narrower contents permission.
      - name: Fast-forward fork main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"branch":"main"}'
